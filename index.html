<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音声共有サイト</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body, div, input, textarea, select, button, a, label, span {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: #ffffff;
      color: #222222;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      line-height: 1.6;
    }
    .header-area {
      text-align: center;
      margin-bottom: 16px;
    }
    .title-badge {
      display: inline-block;
      background-color: #1d4ed8;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      padding: 10px 28px;
      border-radius: 10px;
      letter-spacing: 0.05em;
    }
    .intro-text {
      font-size: 13.5px;
      color: #333333;
      margin-bottom: 20px;
    }
    .intro-text a {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
    }
    .top-grid {
      display: flex;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 24px;
    }
    .upload-box {
      flex: 1.5;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 18px 14px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .upload-label {
      font-size: 14px;
      font-weight: bold;
      color: #475569;
      text-align: center;
      cursor: pointer;
    }
    .upload-sub {
      font-size: 11.5px;
      color: #64748b;
      text-align: center;
      word-break: break-all;
    }
    .upload-box input[type="file"] {
      display: none;
    }
    .upload-details {
      width: 100%;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }
    .field-label {
      font-size: 12.5px;
      font-weight: bold;
      color: #333333;
      margin-bottom: 4px;
    }
    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .name-input {
      flex: 1;
      background-color: #d4d4d4;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13.5px;
      color: #111111;
      outline: none;
    }
    .ext-badge {
      font-size: 13.5px;
      font-weight: bold;
      color: #333333;
      min-width: 40px;
    }
    .perm-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }
    .perm-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .perm-select {
      appearance: none;
      -webkit-appearance: none;
      background-color: #111111;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      width: 26px;
      height: 24px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
    }
    .perm-arrow {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      pointer-events: none;
    }
    .perm-text {
      font-size: 14px;
      font-weight: bold;
      color: #111111;
    }
    .desc-textarea {
      width: 100%;
      height: 90px;
      background-color: #d4d4d4;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13.5px;
      font-family: inherit;
      color: #111111;
      resize: vertical;
      outline: none;
      margin-bottom: 12px;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .post-btn {
      background-color: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .post-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .cancel-upload-btn {
      background-color: #e5e7eb;
      color: #333333;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: bold;
      cursor: pointer;
    }
    .status-msg {
      font-size: 12.5px;
      font-weight: bold;
      margin-top: 6px;
      color: #16a34a;
      min-height: 18px;
    }
    .stats-box {
      flex: 1;
      background-color: #65c466;
      color: #111111;
      border-radius: 6px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-weight: bold;
    }
    .stats-label {
      font-size: 13px;
      margin-bottom: 2px;
    }
    .stats-value {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .stats-value:last-child {
      margin-bottom: 0;
    }
    .section-badge {
      display: inline-block;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      padding: 8px 26px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .badge-mint {
      background-color: #5ce1c6;
    }
    .badge-pink {
      background-color: #e93d82;
    }
    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #64748b;
    }
    .search-input {
      width: 100%;
      background-color: #e5e7eb;
      border: none;
      border-radius: 999px;
      padding: 9px 16px 9px 36px;
      font-size: 14px;
      outline: none;
    }
    .voice-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }
    .voice-card {
      background-color: #e5e7eb;
      border-radius: 16px;
      padding: 16px 18px;
    }
    .voice-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .voice-desc-label {
      font-size: 11px;
      color: #555555;
    }
    .voice-desc {
      font-size: 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .voice-bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    audio {
      flex: 1;
      min-width: 200px;
      height: 36px;
    }
    .download-btn {
      background-color: #e09119;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 999px;
      display: inline-block;
      text-align: center;
    }
    .no-download-tag {
      font-size: 12px;
      color: #666666;
      font-weight: bold;
      padding: 6px 12px;
    }
    .empty-msg {
      font-size: 14px;
      color: #666666;
      margin: 4px 0;
    }
    .comment-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .comment-input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      font-size: 14px;
    }
    .comment-send-btn {
      background-color: #e93d82;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .comment-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    .comment-bubble {
      display: inline-block;
      background-color: #b5b5b5;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: bold;
      padding: 7px 18px;
      border-radius: 999px;
      max-width: 100%;
      word-break: break-word;
      align-self: flex-start;
    }
    .comment-reaction-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }
    .comment-reaction-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      color: #333333;
      font-weight: bold;
    }
    .comment-reaction-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .comment-reaction-btn span {
      font-size: 14px;
      line-height: 1;
    }
    .footer-area {
      margin-top: 20px;
    }
    .rule-link {
      color: #2563eb;
      text-decoration: underline;
      font-size: 15px;
      cursor: pointer;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .modal-body {
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.7;
    }
    .modal-close {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header-area">
    <div class="title-badge">音声共有サイト</div>
  </div>

  <div class="intro-text">
    Sp-25789が管理する音声共有サイトです！<br />
    ここにある音声はそれぞれの利用規約を守って利用してください！<br />
    <a onclick="openRuleModal()">ルール</a>を守って利用してください！ぜひ <a href="https://scratch.mit.edu/users/Sp-25789/" target="_blank" rel="noopener">scratch</a> もご覧ください！
  </div>

  <div class="top-grid">
    <div class="upload-box">
      <input id="audioInput" type="file" accept="audio/*" />
      <label for="audioInput" class="upload-label">音声ファイルをアップロード</label>

      <div id="selectedFileHint" class="upload-sub">タップしてファイルを選択</div>

      <div id="uploadDetails" class="upload-details" style="display: none;">
        <div class="field-label">音声名</div>
        <div class="name-row">
          <input id="customNameInput" class="name-input" type="text" placeholder="音声名" />
          <span id="fileExtBadge" class="ext-badge">.mp3</span>
        </div>

        <div class="field-label">ダウンロードを許可</div>
        <label class="perm-row" for="allowDownloadSelect">
          <span class="perm-select-wrap">
            <select id="allowDownloadSelect" class="perm-select">
              <option value="true">○</option>
              <option value="false">×</option>
            </select>
            <span class="perm-arrow">▾</span>
          </span>
          <span id="permLabelText" class="perm-text">する</span>
        </label>

        <div class="field-label">説明</div>
        <textarea id="descInput" class="desc-textarea" placeholder="説明文を��力"></textarea>

        <div class="action-row">
          <button id="uploadBtn" class="post-btn" type="button" onclick="uploadAudio()">投稿</button>
          <button class="cancel-upload-btn" type="button" onclick="resetUploadForm()">キャンセル</button>
        </div>
      </div>

      <div id="statusText" class="status-msg"></div>
    </div>

    <div class="stats-box">
      <div class="stats-label">音声ファイルの数</div>
      <div id="fileCount" class="stats-value">0</div>
      <div class="stats-label">大きさ</div>
      <div id="totalSize" class="stats-value">0 KB</div>
    </div>
  </div>

  <div>
    <div class="section-badge badge-mint">みんなの音声</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" class="search-input" type="text" placeholder="検索" />
    </div>
    <div id="voiceList" class="voice-list"></div>
  </div>

  <div>
    <div class="section-badge badge-pink">コメント</div>
    <div class="comment-form">
      <input id="commentInput" class="comment-input" type="text" placeholder="コメントを入力" />
      <button id="commentSendBtn" class="comment-send-btn" type="button" onclick="postComment()">送信</button>
    </div>
    <div id="commentList" class="comment-list"></div>
  </div>

  <div class="footer-area">
    <a class="rule-link" onclick="openRuleModal()">ルール</a>
  </div>

  <div id="ruleModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="利用ルール">
    <div class="modal-box">
      <div class="modal-title">利用ルール</div>
      <div class="modal-body">
        ・現在ルールは準備中です。<br /><br />
        ・公序良俗に反する音声や、著作権を侵害する音声のアップロードは禁止です。<br /><br />
        ・各音声の説明文に記載された利用条件を守ってご利用ください。
      </div>
      <button class="modal-close" type="button" onclick="closeRuleModal()">閉じる</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jfrewlxchzaluzqvsthi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0USUuu96Uz4XBBFAA2GPcg_GPwKAFfz';
    const BUCKET_NAME = 'Voice';

    const supabaseClient = window.supabase && SUPABASE_URL.startsWith('https://') && SUPABASE_KEY && SUPABASE_KEY !== 'your-anon-key'
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    let allVoices = [];
    let selectedFileExt = '.mp3';

    function escapeHtml(str = '') {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function updatePermLabel() {
      const sel = document.getElementById('allowDownloadSelect');
      const label = document.getElementById('permLabelText');
      if (sel && label) {
        label.textContent = sel.value === 'true' ? 'する' : 'しない';
      }
    }

    function resetUploadForm() {
      const audioInput = document.getElementById('audioInput');
      const customNameInput = document.getElementById('customNameInput');
      const descInput = document.getElementById('descInput');
      const allowDownloadSelect = document.getElementById('allowDownloadSelect');
      const selectedFileHint = document.getElementById('selectedFileHint');
      const statusText = document.getElementById('statusText');
      const uploadDetails = document.getElementById('uploadDetails');

      if (audioInput) audioInput.value = '';
      if (customNameInput) customNameInput.value = '';
      if (descInput) descInput.value = '';
      if (allowDownloadSelect) allowDownloadSelect.value = 'true';
      updatePermLabel();
      if (selectedFileHint) selectedFileHint.textContent = 'タップしてファイルを選択';
      if (statusText) statusText.textContent = '';
      if (uploadDetails) uploadDetails.style.display = 'none';
    }

    function onFileSelected() {
      const input = document.getElementById('audioInput');
      const customNameInput = document.getElementById('customNameInput');
      const fileExtBadge = document.getElementById('fileExtBadge');
      const selectedFileHint = document.getElementById('selectedFileHint');
      const statusText = document.getElementById('statusText');
      const uploadDetails = document.getElementById('uploadDetails');

      if (!input || !input.files || input.files.length === 0) return;
      const file = input.files[0];
      const dotIndex = file.name.lastIndexOf('.');
      const baseName = dotIndex !== -1 ? file.name.slice(0, dotIndex) : file.name;
      selectedFileExt = dotIndex !== -1 ? file.name.slice(dotIndex).toLowerCase() : '.mp3';

      if (customNameInput) customNameInput.value = baseName;
      if (fileExtBadge) fileExtBadge.textContent = selectedFileExt;
      if (selectedFileHint) selectedFileHint.textContent = '選択中：' + file.name;
      if (statusText) statusText.textContent = '';
      if (uploadDetails) uploadDetails.style.display = 'block';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 KB';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function renderVoices() {
      const listEl = document.getElementById('voiceList');
      const keyword = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';

      if (!listEl) return;

      const filtered = allVoices.filter((voice) =>
        (voice.displayName || '').toLowerCase().includes(keyword) ||
        (voice.description || '').toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">音声が見つかりません</div>';
        return;
      }

      listEl.innerHTML = filtered.map((voice) => {
        const safeName = escapeHtml(voice.displayName || '音声');
        const safeDesc = escapeHtml(voice.description || '');
        const audioHtml = voice.publicUrl
          ? `<audio controls src="${voice.publicUrl}"></audio>`
          : '<span class="no-download-tag">再生不可</span>';

        const downloadHtml = voice.allowDownload && voice.publicUrl
          ? `<a href="${voice.publicUrl}" class="download-btn" download="${safeName}">ダウンロード</a>`
          : '<span class="no-download-tag">ダウンロード不可</span>';

        return `
          <div class="voice-card">
            <div class="voice-name">${safeName}</div>
            <div class="voice-desc-label">説明</div>
            <div class="voice-desc">${safeDesc}</div>
            <div class="voice-bottom">
              ${audioHtml}
              ${downloadHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadVoices() {
      const listEl = document.getElementById('voiceList');
      const fileCountEl = document.getElementById('fileCount');
      const totalSizeEl = document.getElementById('totalSize');

      if (!supabaseClient) {
        if (listEl) listEl.innerHTML = '<div class="empty-msg">Supabaseの設定が未完了です</div>';
        return;
      }

      try {
        const [storageRes, infoRes] = await Promise.all([
          supabaseClient.storage.from(BUCKET_NAME).list('', { sortBy: { column: 'created_at', order: 'desc' } }),
          supabaseClient.from('voices_info').select('*')
        ]);

        if (storageRes.error) throw storageRes.error;

        const infoMap = {};
        if (infoRes.data) {
          infoRes.data.forEach((row) => {
            infoMap[row.file_name] = row;
          });
        }

        const files = (storageRes.data || []).filter((item) => item.name !== '.emptyFolderPlaceholder');

        if (fileCountEl) fileCountEl.textContent = String(files.length);
        if (totalSizeEl) totalSizeEl.textContent = formatBytes(files.reduce((sum, file) => sum + (file.metadata?.size || 0), 0));

        allVoices = files.map((file) => {
          const { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(file.name);
          const meta = infoMap[file.name];
          const fallbackName = file.name.replace(/^\d+_/, '');

          return {
            rawName: file.name,
            displayName: meta?.display_name || fallbackName,
            description: meta?.description || 'ダウンロードは自由です',
            allowDownload: typeof meta?.allow_download === 'boolean' ? meta.allow_download : true,
            publicUrl: urlData?.publicUrl || ''
          };
        });

        renderVoices();
      } catch (error) {
        console.error(error);
        if (listEl) listEl.innerHTML = '<div class="empty-msg">音声が見つかりません</div>';
      }
    }

    async function uploadAudio() {
      if (!supabaseClient) {
        alert('Supabaseの設定が未完了です。');
        return;
      }

      const input = document.getElementById('audioInput');
      const customName = document.getElementById('customNameInput')?.value.trim();
      const descInput = document.getElementById('descInput');
      const allowDownload = document.getElementById('allowDownloadSelect')?.value === 'true';
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('statusText');

      if (!input || !input.files || input.files.length === 0) {
        alert('音声ファイルを選択してください。');
        return;
      }

      const file = input.files[0];
      const finalDisplayName = (customName || '音声') + selectedFileExt;
      const storageSafeName = `${Date.now()}_audio${selectedFileExt.replace(/[^a-zA-Z0-9.]/g, '')}`;
      const descText = descInput?.value.trim() || 'ダウンロードは自由です';

      if (btn) btn.disabled = true;
      if (status) {
        status.style.color = '#2563eb';
        status.textContent = '投稿中...';
      }

      try {
        const { error: uploadError } = await supabaseClient.storage.from(BUCKET_NAME).upload(storageSafeName, file);
        if (uploadError) throw uploadError;

        const { error: insertError } = await supabaseClient.from('voices_info').insert([
          {
            file_name: storageSafeName,
            display_name: finalDisplayName,
            description: descText,
            allow_download: allowDownload
          }
        ]);

        if (insertError) throw insertError;

        resetUploadForm();
        await loadVoices();

        if (status) {
          status.style.color = '#16a34a';
          status.textContent = '投稿しました';
        }
      } catch (error) {
        console.error(error);
        if (status) {
          status.style.color = '#dc2626';
          status.textContent = '投稿に失敗しました';
        }
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    const REACTION_STORAGE_PREFIX = 'voice-share-comment-reaction';

    function getReactionStorageKey(commentId, type) {
      return `${REACTION_STORAGE_PREFIX}:${String(commentId)}:${type}`;
    }

    function hasStoredReaction(commentId, type) {
      try {
        return Boolean(localStorage.getItem(getReactionStorageKey(commentId, type)));
      } catch (error) {
        return false;
      }
    }

    function saveReactionState(commentId, type) {
      try {
        localStorage.setItem(getReactionStorageKey(commentId, type), '1');
      } catch (error) {
        console.warn('ローカル保存に失敗しました', error);
      }
    }

    function bindCommentReactionEvents() {
      const listEl = document.getElementById('commentList');
      if (!listEl) return;

      listEl.querySelectorAll('.comment-reaction-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const commentId = btn.dataset.commentId;
          const type = btn.dataset.type;

          if (!commentId || !type || hasStoredReaction(commentId, type)) return;

          const countEl = btn.querySelector('span');
          const beforeValue = Number(countEl?.textContent || '0');
          const nextValue = beforeValue + 1;

          if (countEl) countEl.textContent = String(nextValue);
          btn.disabled = true;
          saveReactionState(commentId, type);

          try {
            if (!supabaseClient) {
              throw new Error('Supabaseの設定が未完了です');
            }

            const { error } = await supabaseClient
              .from('comment_reactions')
              .insert([{ comment_id: Number(commentId), type }]);

            if (error) throw error;
          } catch (error) {
            console.error(error);
            if (countEl) countEl.textContent = String(beforeValue);
            btn.disabled = false;
            try {
              localStorage.removeItem(getReactionStorageKey(commentId, type));
            } catch (removeError) {
              console.warn('ローカル保存の削除に失敗しました', removeError);
            }
          }
        });
      });
    }

    async function loadComments() {
      const listEl = document.getElementById('commentList');
      if (!listEl) return;

      if (!supabaseClient) {
        listEl.innerHTML = '<div class="empty-msg">コメントがありません</div>';
        return;
      }

      try {
        const [commentsRes, reactionsRes] = await Promise.all([
          supabaseClient
            .from('comments')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(30),
          supabaseClient.from('comment_reactions').select('*')
        ]);

        if (commentsRes.error) throw commentsRes.error;
        if (reactionsRes.error) throw reactionsRes.error;

        const comments = commentsRes.data || [];
        const reactionCounts = {};

        (reactionsRes.data || []).forEach((row) => {
          const commentId = String(row.comment_id);
          if (!reactionCounts[commentId]) {
            reactionCounts[commentId] = { hearts: 0, stars: 0 };
          }
          if (row.type === 'hearts') reactionCounts[commentId].hearts += 1;
          if (row.type === 'stars') reactionCounts[commentId].stars += 1;
        });

        if (comments.length === 0) {
          listEl.innerHTML = '<div class="empty-msg">コメントがありません</div>';
          return;
        }

        listEl.innerHTML = comments.map((comment) => {
          const commentId = comment.id;
          const counts = reactionCounts[String(commentId)] || { hearts: 0, stars: 0 };
          const heartDisabled = hasStoredReaction(commentId, 'hearts');
          const starDisabled = hasStoredReaction(commentId, 'stars');

          return `
            <div class="comment-item">
              <div class="comment-bubble">${escapeHtml(comment.content)}</div>
              <div class="comment-reaction-bar">
                <button class="comment-reaction-btn" type="button" data-comment-id="${commentId}" data-type="hearts" ${heartDisabled ? 'disabled' : ''}>💗 <span>${counts.hearts}</span></button>
                <button class="comment-reaction-btn" type="button" data-comment-id="${commentId}" data-type="stars" ${starDisabled ? 'disabled' : ''}>⭐ <span>${counts.stars}</span></button>
              </div>
            </div>
          `;
        }).join('');

        bindCommentReactionEvents();
      } catch (error) {
        console.error(error);
        listEl.innerHTML = '<div class="empty-msg">コメントがありません</div>';
      }
    }

    async function postComment() {
      if (!supabaseClient) {
        alert('Supabaseの設定が未完了です。');
        return;
      }

      const input = document.getElementById('commentInput');
      const text = input?.value.trim();
      if (!text) return;

      input.value = '';
      await supabaseClient.from('comments').insert([{ content: text }]);
      await loadComments();
    }

    function openRuleModal() {
      const modal = document.getElementById('ruleModal');
      if (modal) modal.style.display = 'flex';
    }

    function closeRuleModal() {
      const modal = document.getElementById('ruleModal');
      if (modal) modal.style.display = 'none';
    }

    function bindEvents() {
      const audioInput = document.getElementById('audioInput');
      const searchInput = document.getElementById('searchInput');
      const allowDownloadSelect = document.getElementById('allowDownloadSelect');

      if (audioInput) audioInput.addEventListener('change', onFileSelected);
      if (searchInput) searchInput.addEventListener('input', renderVoices);
      if (allowDownloadSelect) allowDownloadSelect.addEventListener('change', updatePermLabel);
    }

    async function init() {
      updatePermLabel();
      bindEvents();
      await Promise.all([loadVoices(), loadComments()]);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
