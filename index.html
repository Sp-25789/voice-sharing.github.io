<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音声共有サイト</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* keep your CSS */
  </style>
</head>
<body>
  <div class="header-area">
    <div class="title-badge">音声共有サイト</div>
  </div>

  <div class="intro-text">
    Sp-25789が管理する音声共有サイトです！<br />
    ここにある音声はそれぞれの利用規約を守って利用してください！<br />
    <a onclick="openRuleModal()">ルール</a>を守って利用してください！
  </div>

  <div class="top-grid">
    <div class="upload-box">
      <input id="audioInput" type="file" accept="audio/*" />
      <label for="audioInput" class="upload-label">音声ファイルをアップロード</label>
      <div id="selectedFileHint" class="upload-sub">タップしてファイルを選択</div>

      <div id="uploadDetails" class="upload-details" style="display:none;">
        <div class="field-label">音声名</div>
        <div class="name-row">
          <input id="customNameInput" class="name-input" type="text" placeholder="音声名" />
          <span id="fileExtBadge" class="ext-badge">.mp3</span>
        </div>

        <div class="field-label">ダウンロードを許可</div>
        <label class="perm-row">
          <div class="perm-select-wrap">
            <select id="allowDownloadSelect" class="perm-select" onchange="updatePermLabel()">
              <option value="true">する</option>
              <option value="false">しない</option>
            </select>
            <span class="perm-arrow">▼</span>
          </div>
          <span id="permLabelText" class="perm-text">する</span>
        </label>

        <div class="field-label">説明</div>
        <textarea id="descInput" class="desc-textarea" placeholder="説明を入力"></textarea>

        <div class="action-row">
          <button id="uploadBtn" class="post-btn" onclick="uploadAudio()">投稿</button>
          <button class="cancel-upload-btn" type="button" onclick="resetUploadForm()">キャンセル</button>
        </div>

        <div id="statusText" class="status-msg"></div>
      </div>
    </div>

    <div class="stats-box">
      <div class="stats-label">音声ファイルの数</div>
      <div id="fileCount" class="stats-value">0</div>
      <div class="stats-label">大きさ</div>
      <div id="totalSize" class="stats-value">0 KB</div>
    </div>
  </div>

  <div class="section-badge badge-mint">みんなの音声</div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="searchInput" class="search-input" type="text" placeholder="検索" />
  </div>

  <div id="voiceList" class="voice-list"></div>

  <div class="section-badge badge-pink">コメント</div>
  <div class="comment-form">
    <input id="commentInput" class="comment-input" type="text" placeholder="コメント" />
    <button class="comment-send-btn" onclick="postComment()">送信</button>
  </div>
  <div id="commentList" class="comment-list"></div>

  <div class="reaction-bar">
    <button class="reaction-btn" onclick="addReaction('hearts')">💗 <span id="heartCount">0</span></button>
    <button class="reaction-btn" onclick="addReaction('stars')">⭐ <span id="starCount">0</span></button>
  </div>

  <div class="footer-area">
    <a class="rule-link" onclick="openRuleModal()">ルール</a>
  </div>

  <div id="ruleModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">利用ルール</div>
      <div class="modal-body">
        ・現在ルールは準備中です。<br /><br />
        ・公序良俗に反する音声や、著作権を侵害する音声のアップロードは禁止です。<br /><br />
        ・各音声の説明文に記載された利用条件を守ってご利用ください。
      </div>
      <button class="modal-close" onclick="closeRuleModal()">閉じる</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';
    const BUCKET_NAME = 'Voice';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allVoices = [];
    let selectedFileExt = '.mp3';

    function escapeHtml(str = '') {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function updatePermLabel() {
      const sel = document.getElementById('allowDownloadSelect');
      document.getElementById('permLabelText').textContent = sel.value === 'true' ? 'する' : 'しない';
    }

    function resetUploadForm() {
      document.getElementById('audioInput').value = '';
      document.getElementById('customNameInput').value = '';
      document.getElementById('descInput').value = '';
      document.getElementById('allowDownloadSelect').value = 'true';
      updatePermLabel();
      document.getElementById('selectedFileHint').textContent = 'タップしてファイルを選択';
      document.getElementById('statusText').textContent = '';
      document.getElementById('uploadDetails').style.display = 'none';
    }

    function onFileSelected() {
      const input = document.getElementById('audioInput');
      if (!input.files || input.files.length === 0) return;

      const file = input.files[0];
      const dotIndex = file.name.lastIndexOf('.');
      const baseName = dotIndex !== -1 ? file.name.slice(0, dotIndex) : file.name;
      selectedFileExt = dotIndex !== -1 ? file.name.slice(dotIndex).toLowerCase() : '.mp3';

      document.getElementById('customNameInput').value = baseName;
      document.getElementById('fileExtBadge').textContent = selectedFileExt;
      document.getElementById('selectedFileHint').textContent = '選択中：' + file.name;
      document.getElementById('statusText').textContent = '';
      document.getElementById('uploadDetails').style.display = 'block';
    }

    async function loadVoices() {
      const listEl = document.getElementById('voiceList');

      try {
        const [storageRes, infoRes] = await Promise.all([
          supabase.storage.from(BUCKET_NAME).list('', { sortBy: { column: 'created_at', order: 'desc' } }),
          supabase.from('voices_info').select('*')
        ]);

        if (storageRes.error) throw storageRes.error;

        const infoMap = {};
        if (infoRes.data) {
          infoRes.data.forEach((row) => {
            infoMap[row.file_name] = row;
          });
        }

        const files = (storageRes.data || []).filter((item) => item.name !== '.emptyFolderPlaceholder');
        document.getElementById('fileCount').textContent = String(files.length);
        document.getElementById('totalSize').textContent = formatBytes(
          files.reduce((sum, file) => sum + (file.metadata?.size || 0), 0)
        );

        allVoices = files.map((file) => {
          const { data: urlData } = supabase.storage.from(BUCKET_NAME).getPublicUrl(file.name);
          const meta = infoMap[file.name];
          const fallbackName = file.name.replace(/^\d+_/, '');

          return {
            rawName: file.name,
            displayName: meta?.display_name || fallbackName,
            description: meta?.description || 'ダウンロードは自由です',
            allowDownload: typeof meta?.allow_download === 'boolean' ? meta.allow_download : true,
            publicUrl: urlData.publicUrl
          };
        });

        renderVoices();
      } catch (error) {
        console.error(error);
        listEl.innerHTML = '音声が見つかりません';
      }
    }

    function renderVoices() {
      const listEl = document.getElementById('voiceList');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allVoices.filter((voice) =>
        voice.displayName.toLowerCase().includes(keyword) ||
        voice.description.toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">音声が見つかりません</div>';
        return;
      }

      listEl.innerHTML = filtered.map((voice) => `
        <div class="voice-card">
          <div class="voice-name">${escapeHtml(voice.displayName)}</div>
          <div class="voice-desc-label">説明</div>
          <div class="voice-desc">${escapeHtml(voice.description)}</div>

          ${voice.allowDownload
            ? `<a href="${voice.publicUrl}" class="download-btn" download="${escapeHtml(voice.displayName)}">ダウンロード</a>`
            : '<span class="no-download-tag">ダウンロード不可</span>'}
        </div>
      `).join('');
    }

    async function uploadAudio() {
      const input = document.getElementById('audioInput');
      const customName = document.getElementById('customNameInput').value.trim();
      const descInput = document.getElementById('descInput');
      const allowDownload = document.getElementById('allowDownloadSelect').value === 'true';
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('statusText');

      if (!input.files || input.files.length === 0) {
        alert('音声ファイルを選択してください。');
        return;
      }

      const file = input.files[0];
      const finalDisplayName = (customName || '音声') + selectedFileExt;
      const storageSafeName = `${Date.now()}_audio${selectedFileExt.replace(/[^a-zA-Z0-9.]/g, '')}`;
      const descText = descInput.value.trim() || 'ダウンロードは自由です';

      btn.disabled = true;
      status.style.color = '#2563eb';
      status.textContent = '投稿中...';

      try {
        const { error: uploadError } = await supabase.storage.from(BUCKET_NAME).upload(storageSafeName, file);
        if (uploadError) throw uploadError;

        const { error: insertError } = await supabase.from('voices_info').insert([
          {
            file_name: storageSafeName,
            display_name: finalDisplayName,
            description: descText,
            allow_download: allowDownload
          }
        ]);

        if (insertError) throw insertError;

        resetUploadForm();
        await loadVoices();
        status.style.color = '#16a34a';
        status.textContent = '投稿しました';
      } catch (error) {
        console.error(error);
        status.style.color = '#dc2626';
        status.textContent = '投稿に失敗しました';
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('audioInput').addEventListener('change', onFileSelected);
    document.getElementById('searchInput').addEventListener('input', renderVoices);

    function openRuleModal() {
      document.getElementById('ruleModal').style.display = 'flex';
    }

    function closeRuleModal() {
      document.getElementById('ruleModal').style.display = 'none';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 KB';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    async function init() {
      updatePermLabel();
      await Promise.all([loadVoices(), loadComments(), loadReactions()]);
    }
