const SUPABASE_URL = 'supabase.co';
const SUPABASE_KEY = 'sb_publishable_0USUuu96Uz4XBBFAA2GPcg_GPwKAFfz';
const BUCKET_NAME = 'Voice';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allVoices = [];
let selectedFileExt = '.mp3';
// 初期化
async function init() {
await Promise.all([loadVoices(), loadComments(), loadReactions()]);
}
// ファイル選択時の処理（右側の詳細フォームを開く）
function onFileSelected() {
const input = document.getElementById('audioInput');
if (!input.files || input.files.length === 0) return;
const file = input.files;
const dotIndex = file.name.lastIndexOf('.');
const baseName = dotIndex !== -1 ? file.name.substring(0, dotIndex) : file.name;
selectedFileExt = dotIndex !== -1 ? file.name.substring(dotIndex).toLowerCase() : '.mp3';
document.getElementById('customNameInput').value = baseName;
document.getElementById('fileExtBadge').textContent = selectedFileExt;
document.getElementById('selectedFileHint').textContent = '選択中：' + file.name;
document.getElementById('statusText').textContent = '';
document.getElementById('uploadDetails').style.display = 'block';
}
// 「ダウンロードを許可」の▼切り替え（する ⇄ しない）
function updatePermLabel() {
const sel = document.getElementById('allowDownloadSelect');
document.getElementById('permLabelText').textContent = sel.value === 'true' ? 'する' : 'しない';
}
function togglePermSelect() {
const sel = document.getElementById('allowDownloadSelect');
sel.value = sel.value === 'true' ? 'false' : 'true';
updatePermLabel();
}
// フォームを初期状態に戻す
function resetUploadForm() {
document.getElementById('audioInput').value = '';
document.getElementById('customNameInput').value = '';
document.getElementById('descInput').value = '';
document.getElementById('allowDownloadSelect').value = 'true';
updatePermLabel();
document.getElementById('selectedFileHint').textContent = 'タップしてファイルを選択';
document.getElementById('statusText').textContent = '';
document.getElementById('uploadDetails').style.display = 'none';
}
// 音声ファイル一覧＆メタ情報の読み込み
async function loadVoices() {
const listEl = document.getElementById('voiceList');
try {
const [storageRes, infoRes] = await Promise.all([
supabaseClient.storage.from(BUCKET_NAME).list('', { sortBy: { column: 'created_at', order: 'desc' } }),
supabaseClient.from('voices_info').select('*')
]);
if (storageRes.error) {
allVoices = [];
listEl.innerHTML = '音声が見つかりません';
return;
}
const infoMap = {};
if (infoRes.data) {
infoRes.data.forEach(row => {
infoMap[row.file_name] = row;
});
}
const files = (storageRes.data || []).filter(item => item.name !== '.emptyFolderPlaceholder');
// ファイル数と合計サイズの計算（KB / MB 自動切り替え）
document.getElementById('fileCount').textContent = files.length;
const totalBytes = files.reduce((sum, f) => sum + (f.metadata && f.metadata.size ? f.metadata.size : 0), 0);
document.getElementById('totalSize').textContent = formatBytes(totalBytes);
allVoices = files.map(file => {
const { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(file.name);
const meta = infoMap[file.name];
const fallbackName = file.name.replace(/^\d+_/, '');
return {
rawName: file.name,
displayName: (meta && meta.display_name) ? meta.display_name : fallbackName,
description: (meta && meta.description) ? meta.description : 'ダウンロードは自由です',
allowDownload: (meta && typeof meta.allow_download === 'boolean') ? meta.allow_download : true,
publicUrl: urlData.publicUrl
};
});
renderVoices();
} catch (e) {
allVoices = [];
listEl.innerHTML = '音声が見つかりません';
}
}
// 音声一覧の描画
function renderVoices() {
const listEl = document.getElementById('voiceList');
const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
const filtered = allVoices.filter(v =>
v.displayName.toLowerCase().includes(keyword) ||
v.description.toLowerCase().includes(keyword)
);
if (filtered.length === 0) {
listEl.innerHTML = '音声が見つかりません';
return;
}
listEl.innerHTML = '';
filtered.forEach(voice => {
const card = document.createElement('div');
card.className = 'voice-card';
const downloadHtml = voice.allowDownload
? <a href="${voice.publicUrl}?download=${encodeURIComponent(voice.displayName)}" class="download-btn" download="${escapeHtml(voice.displayName)}">ダウンロード</a>
: <span class="no-download-tag">ダウンロード不可</span>;
card.innerHTML = `
${escapeHtml(voice.displayName)}
説明
${escapeHtml(voice.description)}

${downloadHtml}

`;
listEl.appendChild(card);
});
}
// 音声投稿（アップロード）処理
async function uploadAudio() {
const input = document.getElementById('audioInput');
const customName = document.getElementById('customNameInput').value.trim();
const descInput = document.getElementById('descInput');
const allowDownload = document.getElementById('allowDownloadSelect').value === 'true';
const btn = document.getElementById('uploadBtn');
const status = document.getElementById('statusText');
if (!input.files || input.files.length === 0) {
alert('音声ファイルを選択してください。');
return;
}
const file = input.files;
const finalDisplayName = (customName || '音声') + selectedFileExt;
const storageSafeName = ${Date.now()}_audio${selectedFileExt.replace(/[^a-zA-Z0-9.]/g, '')};
const descText = descInput.value.trim() || 'ダウンロードは自由です';
btn.disabled = true;
status.style.color = '#2563eb';
status.textContent = '投稿中...';
const { error: uploadError } = await supabaseClient.storage.from(BUCKET_NAME).upload(storageSafeName, file);
if (uploadError) {
btn.disabled = false;
status.style.color = '#dc2626';
status.textContent = '投稿に失敗しました';
return;
}
await supabaseClient.from('voices_info').insert([{
file_name: storageSafeName,
display_name: finalDisplayName,
description: descText,
allow_download: allowDownload
}]);
btn.disabled = false;
resetUploadForm();
await loadVoices();
}
// コメントの読み込み
async function loadComments() {
const listEl = document.getElementById('commentList');
try {
const { data, error } = await supabaseClient
.from('comments')
.select('*')
.order('created_at', { ascending: false })
.limit(30);
if (error || !data || data.length === 0) {
listEl.innerHTML = 'コメントがありません';
return;
}
listEl.innerHTML = '';
data.forEach(c => {
const div = document.createElement('div');
div.className = 'comment-bubble';
div.textContent = c.content;
listEl.appendChild(div);
});
} catch (e) {
listEl.innerHTML = 'コメントがありません';
}
}
// コメント投稿
async function postComment() {
const input = document.getElementById('commentInput');
const text = input.value.trim();
if (!text) return;
input.value = '';
await supabaseClient.from('comments').insert([{ content: text }]);
await loadComments();
}
// 💗と⭐の読み込み
async function loadReactions() {
try {
const { data } = await supabaseClient.from('reactions').select('*').eq('id', 1).single();
if (data) {
document.getElementById('heartCount').textContent = data.hearts;
document.getElementById('starCount').textContent = data.stars;
}
} catch (e) {}
}
// 💗と⭐のカウント増加
async function addReaction(type) {
const countEl = document.getElementById(type === 'hearts' ? 'heartCount' : 'starCount');
const nextVal = parseInt(countEl.textContent || '0', 10) + 1;
countEl.textContent = nextVal;
await supabaseClient.from('reactions').update({ [type]: nextVal }).eq('id', 1);
}
// サイズ表記変換（KB / MB / GB 自動切り替え）
function formatBytes(bytes) {
if (!bytes || bytes === 0) return '0 KB';
if (bytes < 1024 * 1024) {
return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}
if (bytes < 1024 * 1024 * 1024) {
return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}
// ルール小窓の開閉
function openRuleModal() {
document.getElementById('ruleModal').style.display = 'flex';
}
function closeRuleModal() {
document.getElementById('ruleModal').style.display = 'none';
}
function escapeHtml(str) {
return str.replace(/[&<>"']/g, m => ({
'&': '&', '<': '<', '>': '>', '"': '"', "'": '''
}[m]));
}
init();
