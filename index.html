<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声共有サイト</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .upload-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="file"] {
      padding: 10px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
    }
    button {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      font-size: 14px;
      color: #059669;
      margin-top: 8px;
      font-weight: bold;
    }
    .voice-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 0;
    }
    .voice-item:last-child {
      border-bottom: none;
    }
    .voice-title {
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .voice-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    audio {
      flex: 1;
      min-width: 220px;
      height: 40px;
    }
    .download-btn {
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
    }
    .download-btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <h1>🎙️ 音声共有サイト</h1>

  <div class="card">
    <h2>音声をアップロード</h2>
    <div class="upload-area">
      <input type="file" id="audioInput" accept="audio/*">
      <button id="uploadBtn" onclick="uploadAudio()">アップロードする</button>
    </div>
    <div id="statusText" class="status"></div>
  </div>

  <div class="card">
    <h2>みんなの音声一覧</h2>
    <div id="voiceList">読み込み中...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0USUuu96Uz4XBBFAA2GPcg_GPwKAFfz';
    const BUCKET_NAME = 'Voice';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadVoices() {
      const listEl = document.getElementById('voiceList');
      const { data, error } = await supabaseClient
        .storage
        .from(BUCKET_NAME)
        .list('', { sortBy: { column: 'created_at', order: 'desc' } });

      if (error) {
        listEl.innerHTML = '<p style="color:red;">読み込みエラーが発生しました。</p>';
        return;
      }

      const files = data.filter(item => item.name !== '.emptyFolderPlaceholder');
      if (files.length === 0) {
        listEl.innerHTML = '<p>まだ音声ファイルがありません。最初の音声をアップロードしてみましょう！</p>';
        return;
      }

      listEl.innerHTML = '';
      files.forEach(file => {
        const { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(file.name);
        const publicUrl = urlData.publicUrl;
        const displayName = file.name.replace(/^\d+_/, '');

        const itemDiv = document.createElement('div');
        itemDiv.className = 'voice-item';
        itemDiv.innerHTML = `
          <div class="voice-title">🎵 ${escapeHtml(displayName)}</div>
          <div class="voice-controls">
            <audio controls src="${publicUrl}"></audio>
            <a href="${publicUrl}?download=${encodeURIComponent(displayName)}" class="download-btn" download="${escapeHtml(displayName)}">ダウンロード</a>
          </div>
        `;
        listEl.appendChild(itemDiv);
      });
    }

    async function uploadAudio() {
      const input = document.getElementById('audioInput');
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('statusText');

      if (!input.files || input.files.length === 0) {
        alert('音声ファイルを選択してください。');
        return;
      }

      const file = input.files[0];
      const safeFileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;

      btn.disabled = true;
      status.textContent = 'アップロード中...';

      const { error } = await supabaseClient
        .storage
        .from(BUCKET_NAME)
        .upload(safeFileName, file);

      btn.disabled = false;

      if (error) {
        status.style.color = 'red';
        status.textContent = 'アップロードに失敗しました：' + error.message;
      } else {
        status.style.color = '#059669';
        status.textContent = 'アップロードが完了しました！';
        input.value = '';
        loadVoices();
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    loadVoices();
  </script>

</body>
</html>
